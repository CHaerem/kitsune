<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tidier</title>
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="archived.css">
</head>
<body>
  <div id="hiding" class="notice" hidden>
    <button id="allow-hiding">Let Tidier hide the other spaces' tabs</button>
  </div>
  <section id="essentials" aria-label="Essentials"></section>
  <div id="space-name"></div>
  <div id="actions">
    <button id="new-tab" title="New tab">＋ New tab</button>
    <button id="new-folder" title="New folder">＋</button>
  </div>
  <main id="tabs" aria-label="Tabs"></main>
  <div id="problem" class="notice" hidden></div>
  <nav id="spaces" aria-label="Spaces"></nav>
  <div id="menu" hidden></div>
  <script src="sidebar.js"></script>
  <script src="menu.js"></script>
  <script src="drag.js"></script>
  <script src="keys.js"></script>
  <script src="archived.js"></script>
</body>
</html>
