# The smoke test on GitHub: the same tests/smoke.py as on your Mac, in a
# headless Firefox on a macOS runner, with the newest Sidebery and both the
# newest Firefox (what yours updates to) and Firefox Beta (about four weeks
# ahead, so a Firefox change that would break something shows up before it
# reaches you). It runs on pushes and pull requests here and every Monday, so
# a Firefox or Sidebery update that breaks something shows up even when
# nothing here changed; start it by hand (Actions → Smoke test → Run
# workflow) after changing dotfiles. GitHub e-mails you when a run fails.
#
# The Firefox files come from the private dotfiles repository, read with a
# read-only deploy key (secret DOTFILES_DEPLOY_KEY, set up once with
# tools/setup-ci-keys.sh). Pull requests from forks do not get secrets, so the
# test is skipped for them.
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Firefox ${{ matrix.firefox }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Beta on the weekly (and manual) run, so pushes stay quick.
        firefox: ${{ fromJSON(contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) && '["latest", "latest-beta"]' || '["latest"]') }}
    steps:
      - name: Check out Kitsune
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kitsune
          persist-credentials: false
      - name: Check out dotfiles (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CHaerem/dotfiles
          ssh-key: ${{ secrets.DOTFILES_DEPLOY_KEY }}
          path: dotfiles
          persist-credentials: false
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: ${{ matrix.firefox }}
      - name: Download Sidebery
        run: curl -fsSL -o "$RUNNER_TEMP/sidebery.xpi" https://addons.mozilla.org/firefox/downloads/latest/sidebery/latest.xpi
      - name: Smoke test
        env:
          KITSUNE_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          KITSUNE_SIDEBERY_XPI: ${{ runner.temp }}/sidebery.xpi
          KITSUNE_DOTFILES: ${{ github.workspace }}/dotfiles/home/firefox
        run: |
          echo "Firefox ${{ steps.firefox.outputs.firefox-version }} at $KITSUNE_FIREFOX"
          python3 -I kitsune/tests/smoke.py
