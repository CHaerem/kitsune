# Release: when the smoke test has passed for a push to main, tools/release.py
# signs the extension on addons.mozilla.org and puts it on a GitHub Release.
# Firefox finds it through update_url in manifest.json and updates itself,
# usually within a day (or at once with "Check for updates" in about:addons).
# Nothing happens if nothing in the extension changed.
#
# Any green run on main can release, not only a push's: a run started by hand
# or by the schedule cancels a push's run (same concurrency group in smoke.yml),
# and that commit must not wait for the next push. tools/release.py does nothing
# when there is nothing new, so "Run workflow" also recovers a commit left behind.
# Pull requests never release (and their runs are not on the branch main).
#
# The AMO API key is in the secrets AMO_JWT_ISSUER and AMO_JWT_SECRET, set up
# once with tools/setup-amo-key.sh. This workflow only runs code from main
# (workflow_run always does), so pull requests never see the key.
name: Release

on:
  workflow_run:
    workflows: [Smoke test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # all commits (the version) and tags (the last release)
          persist-credentials: false
      - name: Sign and release
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: python3 -I tools/release.py
